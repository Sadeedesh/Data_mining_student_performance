<!DOCTYPE html>
<html>
<head>
    <title>Order Search System</title>
</head>
<body>

    <h2>Search Person by Order Number</h2>

    <form method="POST">
        <input type="number" name="order_id" placeholder="Enter Order ID" required>
        <button type="submit">Search</button>
    </form>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    {% if person is not none and not person.empty %}
        <h3>Person Details:</h3>
        <table border="1" cellpadding="5">
            {% for col in person.columns %}
            <tr>
                <th>{{ col }}</th>
                <td>{{ person.iloc[0][col] }}</td>
            </tr>
            {% endfor %}
        </table>
    {% endif %}

</body>
</html>
